<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>0.01 SECONDS — K.B. Fanfiction Directory</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #111;
      color: #fff;
      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
    }


    /* =========================================
       HOME
    ========================================= */

    .home {
      position: relative;

      width: 100%;
      height: 100dvh;

      overflow: hidden;

      background: #111;
    }


    /* =========================================
       ① BACKGROUND
       爆豪だけの画像
    ========================================= */

    .background-image {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      z-index: 1;
    }


    /* =========================================
       ② PLUS ULTRA
       Plus Ultra + 下線
    ========================================= */

    .plus-ultra {
      position: absolute;

      z-index: 3;

      left: 5%;
      top: 37%;

      width: 24%;
      height: auto;

      pointer-events: none;
    }


    /* =========================================
       ③ ORANGE GRAPHIC
       オレンジのギザギザ
    ========================================= */

    .orange-graphic {
      position: absolute;

      z-index: 3;

      right: 0%;
      bottom: 5%;

      width: 45%;
      height: auto;

      pointer-events: none;
    }


    /* =========================================
       HEADER
    ========================================= */

    .header {
      position: absolute;

      z-index: 30;

      top: 5%;
      left: 6%;

      width: 88%;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }


    /* =========================================
       LEFT TOP TEXT
    ========================================= */

    .directory-label {
      font-size: 10px;

      font-weight: 300;

      line-height: 1.9;

      letter-spacing: 0.28em;

      color: rgba(255, 255, 255, 0.88);
    }


    /* =========================================
       MENU BUTTON
    ========================================= */

    .menu-button {
      position: relative;

      width: 42px;
      height: 34px;

      padding: 0;

      border: none;

      background: transparent;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      z-index: 40;
    }


    .menu-button span {
      position: absolute;

      left: 0;

      width: 100%;
      height: 2px;

      background: #fff;

      transition:
        transform 0.35s ease,
        top 0.35s ease,
        opacity 0.25s ease;
    }


    .menu-button span:nth-child(1) {
      top: 3px;
    }


    .menu-button span:nth-child(2) {
      top: 16px;
    }


    .menu-button span:nth-child(3) {
      top: 29px;
    }


    /* =========================================
       ☰ → ×
    ========================================= */

    .menu-button.active span:nth-child(1) {
      top: 16px;

      transform: rotate(45deg);
    }


    .menu-button.active span:nth-child(2) {
      opacity: 0;
    }


    .menu-button.active span:nth-child(3) {
      top: 16px;

      transform: rotate(-45deg);
    }


    /* =========================================
       MAIN TITLE
       画面の上下中央
    ========================================= */

    .hero-title {
      position: absolute;

      z-index: 5;

      top: 50%;
      left: 5%;

      width: 90%;

      transform: translateY(-50%);

      text-align: center;
    }


    .hero-title h1 {
      font-family:
        "Times New Roman",
        Times,
        serif;

      font-size: clamp(48px, 14vw, 88px);

      font-weight: 400;

      line-height: 0.9;

      letter-spacing: 0.08em;

      color: #fff;
    }


    .hero-title .seconds {
      display: block;

      margin-top: 18px;

      font-size: clamp(40px, 11.5vw, 78px);

      letter-spacing: 0.08em;
    }


    /* =========================================
       SUBTITLE
    ========================================= */

    .subtitle {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 13px;

      margin-top: 28px;

      font-family:
        "Times New Roman",
        Times,
        serif;

      font-size: 14px;

      font-weight: 400;

      letter-spacing: 0.16em;

      color: rgba(255, 255, 255, 0.92);
    }


    .subtitle::before,
    .subtitle::after {
      content: "";

      width: 34px;
      height: 1px;

      background: rgba(255, 255, 255, 0.7);
    }


    /* =========================================
       BOTTOM TEXT
    ========================================= */

    .bottom-copy {
      position: absolute;

      z-index: 5;

      left: 6%;
      bottom: 6%;

      font-size: 10px;

      font-weight: 300;

      line-height: 2.05;

      letter-spacing: 0.25em;

      color: rgba(255, 255, 255, 0.9);
    }


    .bottom-copy::after {
      content: "";

      display: block;

      width: 30px;
      height: 2px;

      margin-top: 15px;

      background: #e45116;
    }


    /* =========================================
       MENU OVERLAY
       黒80%
    ========================================= */

    .menu-overlay {
      position: absolute;

      inset: 0;

      z-index: 20;

      display: flex;

      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.8);

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }


    /* =========================================
       MENU OPEN
    ========================================= */

    .menu-overlay.active {
      opacity: 1;

      visibility: visible;

      pointer-events: auto;
    }


    /* =========================================
       MENU LIST
    ========================================= */

    .menu-list {
      list-style: none;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 28px;

      text-align: center;
    }


    .menu-list li {
      opacity: 0;

      transform: translateY(10px);

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }


    .menu-overlay.active .menu-list li {
      opacity: 1;

      transform: translateY(0);
    }


    .menu-overlay.active .menu-list li:nth-child(1) {
      transition-delay: 0.05s;
    }


    .menu-overlay.active .menu-list li:nth-child(2) {
      transition-delay: 0.10s;
    }


    .menu-overlay.active .menu-list li:nth-child(3) {
      transition-delay: 0.15s;
    }


    .menu-overlay.active .menu-list li:nth-child(4) {
      transition-delay: 0.20s;
    }


    .menu-list a {
      display: block;

      color: #fff;

      text-decoration: none;

      font-family:
        "Times New Roman",
        Times,
        serif;

      font-size: 20px;

      font-weight: 400;

      letter-spacing: 0.16em;

      transition: opacity 0.2s ease;
    }


    .menu-list a:hover {
      opacity: 0.6;
    }


    /* =========================================
       SMALL HEIGHT
    ========================================= */

    @media (max-height: 700px) {

      .header {
        top: 4%;
      }


      .hero-title h1 {
        font-size: 46px;
      }


      .hero-title .seconds {
        font-size: 41px;

        margin-top: 12px;
      }


      .subtitle {
        margin-top: 18px;

        font-size: 12px;
      }


      .bottom-copy {
        bottom: 5%;
      }


      .plus-ultra {
        top: 43%;
      }


      .orange-graphic {
        bottom: 2%;
      }

    }


    /* =========================================
       VERY SMALL WIDTH
    ========================================= */

    @media (max-width: 360px) {

      .directory-label {
        font-size: 9px;
      }


      .menu-button {
        width: 35px;
        height: 28px;
      }


      .menu-button span:nth-child(1) {
        top: 2px;
      }


      .menu-button span:nth-child(2) {
        top: 13px;
      }


      .menu-button span:nth-child(3) {
        top: 24px;
      }


      .menu-button.active span:nth-child(1),
      .menu-button.active span:nth-child(3) {
        top: 13px;
      }


      .hero-title h1 {
        font-size: 42px;
      }


      .hero-title .seconds {
        font-size: 38px;
      }


      .subtitle {
        font-size: 11px;

        gap: 8px;
      }


      .subtitle::before,
      .subtitle::after {
        width: 20px;
      }


      .bottom-copy {
        font-size: 9px;
      }


      .plus-ultra {
        width: 27%;
      }

    }

  </style>

</head>


<body>


  <main class="home">


    <!-- =====================================
         ① BACKGROUND IMAGE
         爆豪だけの画像
    ====================================== -->

    <img
      class="background-image"
      src="895.jpg"
      alt=""
    >


    <!-- =====================================
         ② PLUS ULTRA
         Plus Ultra + 下線
    ====================================== -->

    <img
      class="plus-ultra"
      src="plus.png"
      alt=""
    >


    <!-- =====================================
         ③ ORANGE GRAPHIC
         オレンジのギザギザ
    ====================================== -->

    <img
      class="orange-graphic"
      src="zigzag.png"
      alt=""
    >


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">


      <!-- 左上 -->

      <div class="directory-label">

        KATSUKI BAKUGO<br>
        FANFICTION<br>
        DIRECTORY

      </div>


      <!-- ハンバーガー / × -->

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="メニューを開く"
        aria-expanded="false"
      >

        <span></span>
        <span></span>
        <span></span>

      </button>


    </header>


    <!-- =====================================
         MAIN TITLE
    ====================================== -->

    <section class="hero-title">


      <h1>

        0.01

        <span class="seconds">
          SECONDS
        </span>

      </h1>


      <div class="subtitle">

        K.B. Fanfiction Directory

      </div>


    </section>


    <!-- =====================================
         BOTTOM COPY
    ====================================== -->

    <div class="bottom-copy">

      ALL OF<br>
      KATSUKI BAKUGO'S<br>
      DREAMS<br>
      ARE HERE.

    </div>


    <!-- =====================================
         MENU
         黒80%
    ====================================== -->

    <nav
      class="menu-overlay"
      id="menuOverlay"
      aria-hidden="true"
    >


      <ul class="menu-list">


        <li>
          <a href="index.html">
            index
          </a>
        </li>


        <li>
          <a href="about.html">
            about
          </a>
        </li>


        <li>
          <a href="novel.html">
            novel
          </a>
        </li>


        <li>
          <a href="en.html">
            En.
          </a>
        </li>


      </ul>


    </nav>


  </main>


  <!-- =====================================
       JAVASCRIPT
       メニュー開閉
  ====================================== -->

  <script>

    const menuButton =
      document.getElementById("menuButton");

    const menuOverlay =
      document.getElementById("menuOverlay");


    menuButton.addEventListener("click", function () {

      const isOpen =
        menuButton.classList.toggle("active");


      menuOverlay.classList.toggle("active");


      menuButton.setAttribute(
        "aria-expanded",
        isOpen
      );


      menuOverlay.setAttribute(
        "aria-hidden",
        !isOpen
      );

    });

  </script>


</body>

</html>
